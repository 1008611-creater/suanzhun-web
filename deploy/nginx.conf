# 「算的准」静态站点 Nginx 配置
# 服务器上放在 /srv/suanzhun/nginx.conf，只读挂载进容器。
# Caddy 已在上层负责 TLS 与安全响应头，这里只补压缩、缓存与静态资源细节。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # 缓存策略统一在这里声明，上层 Caddy 不再重复设置。
    # 站点尚未给静态资源加内容哈希，脚本必须每次回源校验，否则更新会延迟生效。
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 图标与分享卡片很少变动，可以长缓存。
    location ~* \.(?:svg|png|jpg|jpeg|webp|woff2)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
