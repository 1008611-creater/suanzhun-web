# 「算的准」静态站点 Nginx 配置
# 服务器上放在 /srv/suanzhun/nginx.conf，只读挂载进容器。
# Caddy 已在上层负责 TLS 与安全响应头，这里只补压缩、缓存与静态资源细节。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # 站点没有内联脚本、eval、iframe、表单或外部资源，所以脚本完全禁掉内联。
    # 样式已全部搬到 assets/ 下的外部样式表，页面里没有 <style> 块与 style 属性，
    # style-src 因此也不含 'unsafe-inline'。
    # 这份字符串必须与 scripts/serve.mjs 的 CSP 常量逐字一致，测试会锁死，避免两边漂移。
    #
    # 注意：nginx 的 add_header 不继承——只要某个 location 自己写了 add_header，
    # 服务器层的 add_header 就整组失效。所以下面每个设置了 Cache-Control 的
    # location 都必须自己再写一遍 CSP，否则 HTML/JS/CSS 这些最需要 CSP 的响应
    # 反而会没有。测试会逐块校验，漏写即失败。
    set $csp "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; manifest-src 'self'; upgrade-insecure-requests";
    add_header Content-Security-Policy $csp always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # 缓存策略统一在这里声明，上层 Caddy 不再重复设置。
    # 站点尚未给静态资源加内容哈希，脚本必须每次回源校验，否则更新会延迟生效。
    location ~* \.(?:html|js|css)$ {
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 图标与分享卡片很少变动，可以长缓存。
    location ~* \.(?:svg|png|jpg|jpeg|webp|woff2|ico)$ {
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 清单与站点地图一样：内容稳定但偶尔更新，取一小时缓存。
    location = /site.webmanifest {
        types { } default_type application/manifest+json;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
