# 「算的准」静态站点 Nginx 配置
# 服务器上放在 /srv/suanzhun/nginx.conf，只读挂载进容器。
# Caddy 已在上层负责 TLS 与安全响应头，这里只补压缩、缓存与静态资源细节。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # 带内容哈希或长期稳定的资源：长缓存
    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /apple-touch-icon.png {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /og-image.png {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # 页面与脚本：每次回源校验，避免用户看到旧版本
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
