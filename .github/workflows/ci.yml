name: CI

on:
  push:
    branches: ['master', 'main']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run secret-scan
      - run: npm run check
      - run: npm run contrast
      - run: npm test
